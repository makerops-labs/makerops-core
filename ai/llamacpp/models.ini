version = 1

; Shared by every model. Values measured 2026-11-27 against the same models under Ollama.
[*]
jinja = true
flash-attn = on
; llama-server's 8 GB host prompt-cache default caused OOM kills of the 35b under Ollama
cache-ram = 0
parallel = 1
; safety net: a looping generation becomes a fast failure. 8192 leaves room for long
; legitimate answers (thinking + a long report); measured runaways were 48k tokens.
n-predict = 8192

; Model ids must NOT contain ':' (the router parses text after a colon as a quant tag and
; renames the model). Clients map Ollama-style names (qwen3.6:35b-64k) to these ids.
[qwen3.6-35b-64k]
model = /models/Qwen_Qwen3.6-35B-A3B-Q4_K_M.gguf
c = 64000
n-gpu-layers = 99
; experts of the first 16 layers stay in RAM: 12 spills VRAM into shared memory, 16 is fastest
n-cpu-moe = 16
ubatch-size = 2048
batch-size = 2048
; Qwen's recommended sampling (same values as the Ollama Modelfile)
temp = 1
top-k = 20
top-p = 0.95
min-p = 0
presence-penalty = 1.5
repeat-penalty = 1
