# FreeScout — Help Desk / Shared Inbox
# Project name: freescout  (managed by start.sh / stop.sh)
#
# Services:
#   db         — MariaDB 11 (application database)
#   freescout  — Nginx + PHP-FPM application; exposed on host port 8095

networks:
  backend:

services:

  # ── Database ─────────────────────────────────────────────────────────────────
  db:
    image: mariadb:11
    container_name: freescout_db
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: "${MYSQL_ROOT_PASSWORD}"
      MYSQL_DATABASE: freescout
      MYSQL_USER: freescout
      MYSQL_PASSWORD: "${DB_PASSWORD}"
      TZ: "${TZ:-America/Chicago}"
    volumes:
      - ${FREESCOUT_DB_DATA_PATH:-./data/db}:/var/lib/mysql
    networks:
      - backend
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      start_period: 10s
      interval: 5s
      timeout: 5s
      retries: 10

  # ── Application — host port 8095 ─────────────────────────────────────────────
  freescout:
    # nfrastack/freescout is the successor to tiredofit/freescout (removed from
    # Docker Hub). 2.x renamed several env vars; the .env names are unchanged
    # and mapped here.
    image: nfrastack/freescout:2.2.24
    pull_policy: if_not_present
    container_name: freescout
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      TIMEZONE: "${TZ:-America/Chicago}"
      CONTAINER_NAME: freescout
      DB_HOST: db
      DB_PORT: "3306"
      DB_NAME: freescout
      DB_USER: freescout
      DB_PASS: "${DB_PASSWORD}"
      APP_URL: "${SITE_URL:-http://localhost:8095}"
      # Hosts other than APP_URL's get a 403; include the name-proxy route.
      FREESCOUT_APP_TRUSTED_HOSTS: "${APP_TRUSTED_HOSTS:-localhost,127.0.0.1,freescout.localhost}"
      ADMIN_EMAIL: "${ADMIN_EMAIL}"
      ADMIN_PASS: "${ADMIN_PASS}"
      FREESCOUT_APP_DEBUG: "FALSE"
      ENABLE_AUTO_UPDATE: "FALSE"
      SETUP_TYPE: AUTO
    volumes:
      - ${FREESCOUT_APP_DATA_PATH:-./data/app}:/data
      - ${FREESCOUT_LOGS_PATH:-./data/logs}:/logs
    ports:
      - "${FREESCOUT_PORT:-8095}:80"
    networks:
      - backend
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost/login"]
      start_period: 120s
      interval: 30s
      timeout: 10s
      retries: 3
